<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } 
         from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    
const firebaseConfig = {
  apiKey: "AIzaSyCZerv1iego9a5hlYKORDOdtyWgWFEy2-U",
  authDomain: "project-web-4da26.firebaseapp.com",
  projectId: "project-web-4da26",
  storageBucket: "project-web-4da26.firebasestorage.app",
  messagingSenderId: "67668666228",
  appId: "1:67668666228:web:b6db836ee2ffbd23376e21",
  measurementId: "G-S806SRPV63"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Espera a que Firebase confirme el estado de autenticación
    onAuthStateChanged(auth, (user) => {
        console.log('Estado de autenticación:', user); // Para debugging
        
        if (user) {
            // Usuario autenticado: muestra el contenido
            document.getElementById('userEmail').textContent = `Sesión activa: ${user.email}`;
            document.getElementById('logoutBtn').style.display = 'block';
        } else {
            // No autenticado: espera 1 segundo antes de redirigir
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }
    });

    // Botón de cerrar sesión
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await signOut(auth);
        window.location.href = 'index.html';
    });
</script>
