<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background-color: #f3f4f6; }
        .dashboard-card { background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); width: 100%; max-width: 500px; text-align: center; }
        h1 { color: #111827; margin: 0 0 1rem; }
        p { color: #6b7280; margin: 0 0 2rem; }
        button { padding: 0.75rem 2rem; background-color: #ef4444; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        button:hover { background-color: #dc2626; }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <h1>WELCOME</h1>
        <p id="userEmail">Loading...</p>
        <button id="logoutBtn">Sign Out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
// APIKEY FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyCZerv1iego9a5hlYKORDOdtyWgWFEy2-U",
            authDomain: "project-web-4da26.firebaseapp.com",
            projectId: "project-web-4da26",
            storageBucket: "project-web-4da26.firebasestorage.app",
            messagingSenderId: "67668666228",
            appId: "1:67668666228:web:b6db836ee2ffbd23376e21",
            measurementId: "G-S806SRPV63"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.addEventListener('DOMContentLoaded', () => {
            const emailEl = document.getElementById('userEmail');
            const logoutBtn = document.getElementById('logoutBtn');

            onAuthStateChanged(auth, (user) => {
                if (user) {
                    emailEl.textContent = `User Active Now: ${user.email}`;
                    logoutBtn.style.display = 'inline-block';
                    
                    logoutBtn.addEventListener('click', async () => {
                        await signOut(auth);
                        window.location.href = 'index.html';
                    });
                } else {
                    window.location.href = 'index.html';
                }
            });
        });
    </script>
</body>
</html>
