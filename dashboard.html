<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f3f4f6;
        }
        .dashboard-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { color: #111827; margin: 0 0 1rem; }
        p { color: #6b7280; margin: 0 0 2rem; }
        button {
            padding: 0.75rem 2rem;
            background-color: #ef4444;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { background-color: #dc2626; }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <h1>¡Bienvenido!</h1>
        <p id="userEmail">Cargando...</p>
        <button id="logoutBtn">Cerrar sesión</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } 
             from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "tu-proyecto.firebaseapp.com",
            projectId: "tu-proyecto",
            storageBucket: "tu-proyecto.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abc123"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // 🔒 Protección: verifica si hay usuario autenticado
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Si no está logueado, redirige al login
                window.location.href = 'index.html';
            } else {
                // Muestra el email del usuario
                document.getElementById('userEmail').textContent = `Sesión activa: ${user.email}`;
            }
        });

        // Botón de cerrar sesión
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
